<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Core - Web Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* UI Overlay Container */
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Reticle / Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 2px rgba(0,0,0,0.8);
        }
        #crosshair::before { width: 16px; height: 2px; }
        #crosshair::after { width: 2px; height: 16px; }

        /* Block Mining Progress Bar */
        #mining-progress-container {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, 0);
            width: 120px;
            height: 8px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff;
            border-radius: 4px;
            display: none;
            overflow: hidden;
        }
        #mining-progress-bar {
            width: 0%;
            height: 100%;
            background: #4caf50;
        }

        /* Hotbar UI */
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.65);
            padding: 6px;
            border: 3px solid #333;
            border-radius: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .hotbar-slot {
            width: 54px;
            height: 54px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #555;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
            font-size: 10px;
            font-weight: bold;
        }
        .hotbar-slot.active {
            border-color: #ffeb3b;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 8px #ffeb3b;
        }
        .slot-key {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: #aaa;
        }
        .slot-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 12px;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        /* Overlay Start Screen */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            pointer-events: auto;
            cursor: pointer;
            z-index: 10;
        }
        #overlay h1 { font-size: 3rem; margin-bottom: 12px; text-shadow: 2px 2px #000; color: #4caf50; }
        #overlay p { font-size: 1.1rem; margin: 6px 0; color: #ddd; }
        #overlay .start-btn {
            margin-top: 22px;
            padding: 12px 28px;
            background: #4caf50;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        /* Stats HUD */
        #stats-hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 4px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div id="crosshair"></div>
        <div id="mining-progress-container"><div id="mining-progress-bar"></div></div>
        <div id="stats-hud">
            <div>XYZ: <span id="pos-info">0, 0, 0</span></div>
            <div>Selected: <span id="block-info">Grass Block</span></div>
        </div>
        <div id="hotbar"></div>
    </div>

    <div id="overlay">
        <h1>MINECRAFT CORE</h1>
        <p>Click anywhere to Start Playing</p>
        <p><strong>WASD</strong>: Move | <strong>SHIFT</strong>: Sprint | <strong>SPACE</strong>: Jump</p>
        <p><strong>Left Click (Hold)</strong>: Mine Block | <strong>Right Click</strong>: Place Block</p>
        <p><strong>1-9 / Mouse Wheel</strong>: Select Hotbar Slot</p>
        <button class="start-btn">Click to Start</button>
    </div>

    <!-- Libraries loaded via CDN for standard WebGL rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>

    <script>
        // --- TEXTURE GENERATOR (Procedural 16x16 Pixel Art) ---
        function createPixelTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');

            function fillRandomNoise(baseColor, variation) {
                const [r, g, b] = baseColor;
                for (let x = 0; x < 16; x++) {
                    for (let y = 0; y < 16; y++) {
                        const noise = (Math.random() - 0.5) * variation;
                        const nr = Math.min(255, Math.max(0, r + noise));
                        const ng = Math.min(255, Math.max(0, g + noise));
                        const nb = Math.min(255, Math.max(0, b + noise));
                        ctx.fillStyle = `rgb(${nr},${ng},${nb})`;
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }

            switch(type) {
                case 'grass_top':
                    fillRandomNoise([85, 150, 45], 30);
                    break;
                case 'grass_side':
                    fillRandomNoise([134, 96, 67], 25);
                    ctx.fillStyle = '#55962d';
                    for(let x=0; x<16; x++) {
                        const h = 3 + Math.floor(Math.random() * 3);
                        ctx.fillRect(x, 0, 1, h);
                    }
                    break;
                case 'dirt':
                    fillRandomNoise([134, 96, 67], 25);
                    break;
                case 'stone':
                    fillRandomNoise([120, 120, 120], 35);
                    break;
                case 'wood_side':
                    fillRandomNoise([100, 70, 40], 20);
                    ctx.fillStyle = '#4a3219';
                    for(let x=0; x<16; x+=4) ctx.fillRect(x, 0, 1, 16);
                    break;
                case 'wood_top':
                    fillRandomNoise([160, 120, 80], 15);
                    ctx.strokeStyle = '#8a5a30';
                    ctx.strokeRect(3, 3, 10, 10);
                    break;
                case 'leaves':
                    fillRandomNoise([45, 115, 35], 40);
                    break;
                case 'water':
                    ctx.fillStyle = 'rgba(40, 100, 220, 0.7)';
                    ctx.fillRect(0,0,16,16);
                    break;
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        const textures = {
            grassTop: createPixelTexture('grass_top'),
            grassSide: createPixelTexture('grass_side'),
            dirt: createPixelTexture('dirt'),
            stone: createPixelTexture('stone'),
            woodSide: createPixelTexture('wood_side'),
            woodTop: createPixelTexture('wood_top'),
            leaves: createPixelTexture('leaves'),
            water: createPixelTexture('water')
        };

        const BLOCK = {
            AIR: 0,
            GRASS: 1,
            DIRT: 2,
            STONE: 3,
            WOOD: 4,
            LEAVES: 5,
            WATER: 6
        };

        const BLOCK_CONFIG = {
            [BLOCK.GRASS]: { name: 'Grass Block', mineTime: 0.35, drop: BLOCK.DIRT, mats: [textures.grassSide, textures.grassSide, textures.grassTop, textures.dirt, textures.grassSide, textures.grassSide] },
            [BLOCK.DIRT]: { name: 'Dirt', mineTime: 0.3, drop: BLOCK.DIRT, mats: Array(6).fill(textures.dirt) },
            [BLOCK.STONE]: { name: 'Stone', mineTime: 0.8, drop: BLOCK.STONE, mats: Array(6).fill(textures.stone) },
            [BLOCK.WOOD]: { name: 'Oak Wood', mineTime: 0.6, drop: BLOCK.WOOD, mats: [textures.woodSide, textures.woodSide, textures.woodTop, textures.woodTop, textures.woodSide, textures.woodSide] },
            [BLOCK.LEAVES]: { name: 'Leaves', mineTime: 0.15, drop: BLOCK.LEAVES, mats: Array(6).fill(textures.leaves) },
            [BLOCK.WATER]: { name: 'Water', mineTime: Infinity, drop: null, mats: Array(6).fill(textures.water), transparent: true }
        };

        const blockMaterials = {};
        Object.keys(BLOCK_CONFIG).forEach(id => {
            const config = BLOCK_CONFIG[id];
            blockMaterials[id] = config.mats.map(tex => new THREE.MeshLambertMaterial({
                map: tex,
                transparent: !!config.transparent,
                opacity: config.transparent ? 0.75 : 1.0
            }));
        });

        // --- THREE.JS SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x78a7ff);
        scene.fog = new THREE.FogExp2(0x78a7ff, 0.018);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.75);
        dirLight.position.set(80, 120, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 300;
        const d = 60;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // --- VOXEL WORLD DATA ---
        const WORLD_SIZE = 64;
        const worldBlocks = new Map();

        function getBlockKey(x, y, z) {
            return `${x},${y},${z}`;
        }

        function setBlock(x, y, z, type) {
            const key = getBlockKey(x, y, z);
            if (type === BLOCK.AIR) {
                worldBlocks.delete(key);
            } else {
                worldBlocks.set(key, type);
            }
        }

        function getBlock(x, y, z) {
            return worldBlocks.get(getBlockKey(x, y, z)) || BLOCK.AIR;
        }

        // --- PROCEDURAL TERRAIN GENERATION ---
        const simplex = new SimplexNoise();

        function generateTerrain() {
            const halfSize = WORLD_SIZE / 2;
            for (let x = -halfSize; x < halfSize; x++) {
                for (let z = -halfSize; z < halfSize; z++) {
                    const n1 = simplex.noise2D(x * 0.02, z * 0.02) * 10;
                    const n2 = simplex.noise2D(x * 0.08, z * 0.08) * 3;
                    const height = Math.floor(12 + n1 + n2);

                    for (let y = 0; y <= height; y++) {
                        if (y === height) {
                            setBlock(x, y, z, BLOCK.GRASS);
                        } else if (y >= height - 3) {
                            setBlock(x, y, z, BLOCK.DIRT);
                        } else {
                            setBlock(x, y, z, BLOCK.STONE);
                        }
                    }

                    if (height < 7) {
                        for (let wy = height + 1; wy <= 7; wy++) {
                            setBlock(x, wy, z, BLOCK.WATER);
                        }
                    }

                    if (height >= 8 && Math.random() < 0.012 && Math.abs(x) > 3 && Math.abs(z) > 3) {
                        generateTree(x, height + 1, z);
                    }
                }
            }
        }

        function generateTree(tx, ty, tz) {
            const trunkHeight = 4 + Math.floor(Math.random() * 2);
            for (let i = 0; i < trunkHeight; i++) {
                setBlock(tx, ty + i, tz, BLOCK.WOOD);
            }
            const leafStart = ty + trunkHeight - 2;
            for (let lx = tx - 2; lx <= tx + 2; lx++) {
                for (let ly = leafStart; ly <= ty + trunkHeight + 1; ly++) {
                    for (let lz = tz - 2; lz <= tz + 2; lz++) {
                        if (Math.abs(lx - tx) === 2 && Math.abs(lz - tz) === 2 && ly > leafStart + 1) continue;
                        if (getBlock(lx, ly, lz) === BLOCK.AIR) {
                            setBlock(lx, ly, lz, BLOCK.LEAVES);
                        }
                    }
                }
            }
        }

        generateTerrain();

        // --- INSTANCED MESH RENDERING ---
        const instanceMeshes = {};
        const boxGeometry = new THREE.BoxGeometry(1, 1, 1);

        function rebuildWorldMeshes() {
            Object.values(instanceMeshes).forEach(mesh => scene.remove(mesh));

            const blockGroups = {};
            for (let [key, type] of worldBlocks.entries()) {
                if (type === BLOCK.AIR) continue;
                const [x, y, z] = key.split(',').map(Number);

                const surrounded = 
                    getBlock(x+1, y, z) !== BLOCK.AIR && !BLOCK_CONFIG[getBlock(x+1, y, z)]?.transparent &&
                    getBlock(x-1, y, z) !== BLOCK.AIR && !BLOCK_CONFIG[getBlock(x-1, y, z)]?.transparent &&
                    getBlock(x, y+1, z) !== BLOCK.AIR && !BLOCK_CONFIG[getBlock(x, y+1, z)]?.transparent &&
                    getBlock(x, y-1, z) !== BLOCK.AIR && !BLOCK_CONFIG[getBlock(x, y-1, z)]?.transparent &&
                    getBlock(x, y, z+1) !== BLOCK.AIR && !BLOCK_CONFIG[getBlock(x, y, z+1)]?.transparent &&
                    getBlock(x, y, z-1) !== BLOCK.AIR && !BLOCK_CONFIG[getBlock(x, y, z-1)]?.transparent;

                if (surrounded) continue;

                if (!blockGroups[type]) blockGroups[type] = [];
                blockGroups[type].push(new THREE.Vector3(x, y, z));
            }

            const dummy = new THREE.Object3D();

            Object.keys(blockGroups).forEach(type => {
                const positions = blockGroups[type];
                const mesh = new THREE.InstancedMesh(boxGeometry, blockMaterials[type], positions.length);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                for (let i = 0; i < positions.length; i++) {
                    dummy.position.copy(positions[i]);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(i, dummy.matrix);
                }

                mesh.instanceMatrix.needsUpdate = true;
                scene.add(mesh);
                instanceMeshes[type] = mesh;
            });
        }

        rebuildWorldMeshes();

        // Target Box Wireframe
        const selectionBox = new THREE.LineSegments(
            new THREE.WireframeGeometry(new THREE.BoxGeometry(1.005, 1.005, 1.005)),
            new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 })
        );
        selectionBox.visible = false;
        scene.add(selectionBox);

        // --- INVENTORY MANAGEMENT ---
        const inventory = [
            { id: BLOCK.DIRT, count: 12 },
            { id: BLOCK.STONE, count: 20 },
            { id: BLOCK.WOOD, count: 8 },
            { id: BLOCK.LEAVES, count: 15 },
            { id: BLOCK.GRASS, count: 5 },
            { id: null, count: 0 },
            { id: null, count: 0 },
            { id: null, count: 0 },
            { id: null, count: 0 }
        ];
        let activeHotbarIndex = 0;

        const hotbarEl = document.getElementById('hotbar');

        function renderHotbar() {
            hotbarEl.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const item = inventory[i];
                const slot = document.createElement('div');
                slot.className = `hotbar-slot ${i === activeHotbarIndex ? 'active' : ''}`;
                
                const keyLabel = document.createElement('span');
                keyLabel.className = 'slot-key';
                keyLabel.innerText = i + 1;
                slot.appendChild(keyLabel);

                if (item.id && item.count > 0) {
                    const nameLabel = document.createElement('span');
                    nameLabel.style.fontSize = '9px';
                    nameLabel.style.textAlign = 'center';
                    nameLabel.innerText = BLOCK_CONFIG[item.id].name;
                    slot.appendChild(nameLabel);

                    const countLabel = document.createElement('span');
                    countLabel.className = 'slot-count';
                    countLabel.innerText = item.count;
                    slot.appendChild(countLabel);
                }

                hotbarEl.appendChild(slot);
            }
            updateHUDInfo();
        }

        function addItemToInventory(blockId) {
            if (!blockId) return;
            for (let slot of inventory) {
                if (slot.id === blockId) {
                    slot.count++;
                    renderHotbar();
                    return;
                }
            }
            for (let slot of inventory) {
                if (!slot.id || slot.count === 0) {
                    slot.id = blockId;
                    slot.count = 1;
                    renderHotbar();
                    return;
                }
            }
        }

        function consumeActiveItem() {
            const item = inventory[activeHotbarIndex];
            if (item.id && item.count > 0) {
                item.count--;
                const usedId = item.id;
                if (item.count === 0) item.id = null;
                renderHotbar();
                return usedId;
            }
            return null;
        }

        function updateHUDInfo() {
            const activeItem = inventory[activeHotbarIndex];
            document.getElementById('block-info').innerText = activeItem.id ? BLOCK_CONFIG[activeItem.id].name : 'Empty Slot';
        }

        renderHotbar();

        // --- PLAYER PHYSICS & CONTROLS ---
        const player = {
            position: new THREE.Vector3(0, 20, 0),
            velocity: new THREE.Vector3(),
            width: 0.6,
            height: 1.8,
            eyeHeight: 1.62,
            isGrounded: false,
            pitch: 0,
            yaw: 0
        };

        camera.position.copy(player.position);

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code >= 'Digit1' && e.code <= 'Digit9') {
                activeHotbarIndex = parseInt(e.code.replace('Digit', '')) - 1;
                renderHotbar();
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        window.addEventListener('wheel', e => {
            if (e.deltaY > 0) {
                activeHotbarIndex = (activeHotbarIndex + 1) % 9;
            } else {
                activeHotbarIndex = (activeHotbarIndex - 1 + 9) % 9;
            }
            renderHotbar();
        });

        const overlay = document.getElementById('overlay');
        overlay.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                overlay.style.display = 'none';
            } else {
                overlay.style.display = 'flex';
            }
        });

        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement !== document.body) return;
            const sensitivity = 0.002;
            player.yaw -= e.movementX * sensitivity;
            player.pitch -= e.movementY * sensitivity;
            player.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, player.pitch));
        });

        function checkCollision(pos) {
            const minX = Math.floor(pos.x - player.width / 2);
            const maxX = Math.floor(pos.x + player.width / 2);
            const minY = Math.floor(pos.y);
            const maxY = Math.floor(pos.y + player.height);
            const minZ = Math.floor(pos.z - player.width / 2);
            const maxZ = Math.floor(pos.z + player.width / 2);

            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        const block = getBlock(x, y, z);
                        if (block !== BLOCK.AIR && block !== BLOCK.WATER) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function updatePlayerPhysics(dt) {
            const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)).normalize();
            const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw)).normalize();

            const speed = keys['ShiftLeft'] || keys['ShiftRight'] ? 7.5 : 4.5;
            const moveDir = new THREE.Vector3();

            if (keys['KeyW']) moveDir.add(forward);
            if (keys['KeyS']) moveDir.sub(forward);
            if (keys['KeyD']) moveDir.add(right);
            if (keys['KeyA']) moveDir.sub(right);

            if (moveDir.lengthSq() > 0) moveDir.normalize();

            player.velocity.x = moveDir.x * speed;
            player.velocity.z = moveDir.z * speed;
            player.velocity.y -= 24.0 * dt;

            if (keys['Space'] && player.isGrounded) {
                player.velocity.y = 8.2;
                player.isGrounded = false;
            }

            // X Axis
            player.position.x += player.velocity.x * dt;
            if (checkCollision(player.position)) {
                player.position.x -= player.velocity.x * dt;
                player.velocity.x = 0;
            }

            // Z Axis
            player.position.z += player.velocity.z * dt;
            if (checkCollision(player.position)) {
                player.position.z -= player.velocity.z * dt;
                player.velocity.z = 0;
            }

            // Y Axis
            player.position.y += player.velocity.y * dt;
            player.isGrounded = false;
            if (checkCollision(player.position)) {
                player.position.y -= player.velocity.y * dt;
                if (player.velocity.y < 0) player.isGrounded = true;
                player.velocity.y = 0;
            }

            camera.position.set(player.position.x, player.position.y + player.eyeHeight, player.position.z);
            camera.rotation.set(0, 0, 0);
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;
            camera.rotation.order = 'YXZ';

            document.getElementById('pos-info').innerText = `${Math.round(player.position.x)}, ${Math.round(player.position.y)}, ${Math.round(player.position.z)}`;
        }

        // --- RAYCASTING & BLOCK MINING/PLACEMENT ---
        const raycaster = new THREE.Raycaster();
        let targetBlock = null;
        let isMining = false;
        let mineTimer = 0;

        function updateRaycast() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(Object.values(instanceMeshes));

            if (intersects.length > 0 && intersects[0].distance <= 5.5) {
                const hit = intersects[0];
                const point = hit.point.clone().sub(hit.face.normal.clone().multiplyScalar(0.01));
                const bx = Math.round(point.x);
                const by = Math.round(point.y);
                const bz = Math.round(point.z);

                targetBlock = {
                    x: bx, y: by, z: bz,
                    normal: hit.face.normal.clone(),
                    type: getBlock(bx, by, bz)
                };

                selectionBox.position.set(bx, by, bz);
                selectionBox.visible = true;
            } else {
                targetBlock = null;
                selectionBox.visible = false;
            }
        }

        const progressBar = document.getElementById('mining-progress-bar');
        const progressContainer = document.getElementById('mining-progress-container');

        window.addEventListener('mousedown', e => {
            if (document.pointerLockElement !== document.body) return;

            if (e.button === 0) {
                isMining = true;
                mineTimer = 0;
            } else if (e.button === 2) {
                placeBlock();
            }
        });

        window.addEventListener('mouseup', e => {
            if (e.button === 0) {
                isMining = false;
                mineTimer = 0;
                progressContainer.style.display = 'none';
            }
        });

        function handleMining(dt) {
            if (!isMining || !targetBlock || targetBlock.type === BLOCK.WATER || targetBlock.type === BLOCK.AIR) {
                mineTimer = 0;
                progressContainer.style.display = 'none';
                return;
            }

            const config = BLOCK_CONFIG[targetBlock.type];
            if (!config) return;

            mineTimer += dt;
            progressContainer.style.display = 'block';
            const progress = Math.min(100, (mineTimer / config.mineTime) * 100);
            progressBar.style.width = `${progress}%`;

            if (mineTimer >= config.mineTime) {
                setBlock(targetBlock.x, targetBlock.y, targetBlock.z, BLOCK.AIR);
                addItemToInventory(config.drop);
                rebuildWorldMeshes();

                isMining = false;
                mineTimer = 0;
                progressContainer.style.display = 'none';
            }
        }

        function placeBlock() {
            if (!targetBlock) return;
            const activeItem = inventory[activeHotbarIndex];
            if (!activeItem.id || activeItem.count <= 0) return;

            const px = targetBlock.x + targetBlock.normal.x;
            const py = targetBlock.y + targetBlock.normal.y;
            const pz = targetBlock.z + targetBlock.normal.z;

            // Check overlap with player bounding box
            const pMinX = player.position.x - player.width/2;
            const pMaxX = player.position.x + player.width/2;
            const pMinY = player.position.y;
            const pMaxY = player.position.y + player.height;
            const pMinZ = player.position.z - player.width/2;
            const pMaxZ = player.position.z + player.width/2;

            if (px + 0.5 > pMinX && px - 0.5 < pMaxX &&
                py + 0.5 > pMinY && py - 0.5 < pMaxY &&
                pz + 0.5 > pMinZ && pz - 0.5 < pMaxZ) {
                return;
            }

            const placedType = consumeActiveItem();
            if (placedType) {
                setBlock(px, py, pz, placedType);
                rebuildWorldMeshes();
            }
        }

        window.addEventListener('contextmenu', e => e.preventDefault());

        // --- MAIN GAME LOOP ---
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            updatePlayerPhysics(dt);
            updateRaycast();
            handleMining(dt);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
